services:
  examguard:
    build: .
    container_name: examguard-dns
    restart: unless-stopped
    ports:
      # Web Dashboard & Studentski Portal
      - "8000:8000"
      # DNS Poslužitelj - lokalni testni port (5053)
      - "5053:5053/udp"
      # DNS Poslužitelj - standardni mrežni port za učionicu (port 53 na LAN IP-u)
      - "192.168.8.112:53:5053/udp"
    environment:
      - DNS_PORT=5053
      - WEB_PORT=8000
      - UPSTREAM_DNS=1.1.1.1
      - EXAMGUARD_DB=/app/data/examguard.db
    volumes:
      # Trajno spremanje baze na računalu domaćina
      - ./data:/app/data
